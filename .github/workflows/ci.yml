name: CI and image release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag, e.g. v0.30.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      revision: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: checkout
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: '0.11.19'
          enable-cache: true
      - name: Verify Python and SDK contracts
        run: |
          uv lock --check
          uv sync --locked
          uv run --locked pytest tests/test_task_runner.py tests/test_billing.py tests/test_mcp_transport.py tests/test_ssh_sessions.py tests/test_maintenance.py tests/test_deployment_image_cleanup.py
          uv run --locked python .agents/skills/gpu-change-verification/scripts/check_sdk_contract.py --json
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Verify Compose configuration
        run: docker compose --env-file /dev/null config --quiet

  publish:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: verify
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency: ghcr-${{ inputs.release_tag || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.revision }}
          persist-credentials: false
      - name: Verify release ref
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $RELEASE_TAG == "v$version" ]]
          [[ $(git rev-parse "refs/tags/$RELEASE_TAG^{commit}") == "$(git rev-parse HEAD)" ]]
          revision=$(git rev-parse HEAD)
          run_id=$(python3 -c 'import uuid; print(uuid.uuid4().hex)')
          printf 'IMAGE=ghcr.io/%s\nVERSION=%s\nREVISION=%s\nRUN_ID=%s\nGPU_TEST_IMAGE=gpu-console:test-%s-%s\n' \
            "${GITHUB_REPOSITORY,,}" "$version" "$revision" "$run_id" "${revision:0:12}" "$run_id" >> "$GITHUB_ENV"
      - name: Route Docker egress through the runner proxy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tinyproxy-bin
          proxy_config="$RUNNER_TEMP/tinyproxy.conf"
          printf 'Port 17890\nListen 127.0.0.1\nAllow 127.0.0.1\nConnectPort 443\nLogLevel Warning\n' > "$proxy_config"
          tinyproxy -c "$proxy_config"
          proxy=http://127.0.0.1:17890
          exceptions=localhost,127.0.0.1,::1
          curl -fsS --retry 3 --max-time 15 --noproxy '' --proxy "$proxy" --output /dev/null \
            'https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/python:pull'
          sudo install -d /etc/systemd/system/docker.service.d
          printf '[Service]\nEnvironment="HTTP_PROXY=%s" "HTTPS_PROXY=%s" "NO_PROXY=%s"\n' "$proxy" "$proxy" "$exceptions" \
            | sudo tee /etc/systemd/system/docker.service.d/gpu-console-proxy.conf > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart docker
          [[ $(docker info --format '{{.HTTPProxy}} {{.HTTPSProxy}}') == "$proxy $proxy" ]]
          printf 'HTTP_PROXY=%s\nHTTPS_PROXY=%s\nNO_PROXY=%s\nhttp_proxy=%s\nhttps_proxy=%s\nno_proxy=%s\n' \
            "$proxy" "$proxy" "$exceptions" "$proxy" "$proxy" "$exceptions" >> "$GITHUB_ENV"
      - name: Build linux/amd64 image
        run: |
          docker buildx build --builder default --load --network=host --platform linux/amd64 \
            --build-arg HTTP_PROXY --build-arg HTTPS_PROXY --build-arg NO_PROXY \
            --build-arg http_proxy --build-arg https_proxy --build-arg no_proxy \
            --build-arg "GPU_REVISION=$REVISION" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "io.gpu-console.test-run=$RUN_ID" \
            --tag "$GPU_TEST_IMAGE" .
          labels=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}} {{index .Config.Labels "org.opencontainers.image.revision"}}' "$GPU_TEST_IMAGE")
          [[ $labels == "$VERSION $REVISION" ]]
      - name: Smoke-test web, MCP and worker
        run: |
          GPU_TEST_DIR=$(mktemp -d)
          export GPU_TEST_DIR
          sudo install -d -m 0700 -o 10001 -g 10001 "$GPU_TEST_DIR/data" "$GPU_TEST_DIR/secrets" "$GPU_TEST_DIR/secrets/feishu-settings"
          compose=(docker compose --env-file /dev/null -p gpu-console-ci -f compose.yaml -f .agents/skills/gpu-deployment/assets/test.compose.yaml)
          trap '"${compose[@]}" down; sudo rm -rf -- "$GPU_TEST_DIR"' EXIT
          "${compose[@]}" up -d --no-build --pull never --wait --wait-timeout 120
          for service in web mcp; do
            "${compose[@]}" exec -T "$service" python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200"
          done
          "${compose[@]}" exec -T worker gpu-admin worker-health
      - name: Publish verified image to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker image tag "$GPU_TEST_IMAGE" "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:$VERSION")
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '### GHCR release\n\n- Version: `%s:%s`\n- Revision: `%s`\n- Deployment image: `%s@%s`\n' \
            "$IMAGE" "$VERSION" "$REVISION" "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
